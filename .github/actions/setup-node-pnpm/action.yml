name: Setup Node and pnpm
description: Enable Corepack-compatible pnpm, Node from .nvmrc, install with frozen lockfile, restore Turborepo local cache

inputs:
  turbo-cache-key:
    description: Extra key segment for the .turbo cache (usually the job name)
    required: false
    default: shared

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.turbo-cache-key }}-
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
