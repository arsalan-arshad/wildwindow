# Production: fingerprint → reuse build or build+submit; otherwise OTA on production channel.
# Requires store credentials configured on EAS (Apple ASC API key, Google Play service account).
# Push to main only runs after the GitHub repo is linked in the Expo dashboard.
# Manual: cd apps/mobile && eas workflow:run .eas/workflows/deploy-to-production.yml
name: Deploy to production

on:
  push:
    branches: ['main']
    paths:
      - 'apps/mobile/**'
      - 'packages/geoprivacy/**'
      - 'packages/scoring/**'
      - 'packages/shared/**'
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_android_build:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
  submit_ios_build:
    name: Submit iOS
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
  publish_android_update:
    name: Publish Android OTA
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      channel: production
      platform: android
  publish_ios_update:
    name: Publish iOS OTA
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: production
      platform: ios
