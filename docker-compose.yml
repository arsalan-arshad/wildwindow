# Local PostGIS for WildWindow (ARCHITECTURE §2 / §11).
# Image: PostgreSQL 18 + PostGIS 3.7 — project standard (not host Postgres.app).
services:
  db:
    image: postgis/postgis:18-3.7
    # Official postgis/postgis tags are amd64-only today; Docker Desktop on
    # Apple Silicon runs this under emulation (Rosetta / QEMU).
    platform: linux/amd64
    container_name: wildwindow-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wildwindow
    volumes:
      # PG 18+ official image VOLUME is `/var/lib/postgresql` (not `.../data`).
      # New volume name so a leftover PG 17 data dir is never reused.
      - wildwindow_pgdata18:/var/lib/postgresql
      - ./docker/db/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      # Probe TCP so the check fails while the init-only temp server is
      # listening on the Unix socket (before port 5432 accepts clients).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d wildwindow']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  wildwindow_pgdata18:
