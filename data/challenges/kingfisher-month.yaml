rulesMd: |
  # Kingfisher Month

  **Same Species, Different Countries** — Common kingfisher (*Alcedo atthis*) across
  **Scotland** (United Kingdom) and **Sindh** (Pakistan).

  ## Rules

  1. Enter one photo from your WildWindow logbook of a common kingfisher taken during the challenge dates.
  2. Entries show **country and region only** (for example Scotland or Sindh). Exact pins are never published — that is the No-Pin Promise.
  3. Moderators review every entry. Approved photos appear in the public gallery after a **7-day** delay.
  4. One logbook photo can be submitted to a challenge only once.

  ## Ethics pledge

  By submitting you pledge that for this photo there was **no baiting**, **no playback**,
  and **no nest disturbance**.

  Follow the Audubon guide to ethical bird photography: keep your distance, put the animal
  first, and leave the place as you found it.
