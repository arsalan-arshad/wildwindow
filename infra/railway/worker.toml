# Railway "worker" service settings (Root Directory = monorepo root).
# Default CMD is `hello` (smoke). Override start command / use Cron for real jobs.
# Do NOT enable GBIF until T3.9 + credentials are ready.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"
watchPatterns = [
  "apps/worker/**",
  "packages/db/**",
  "packages/geoprivacy/**",
  "packages/scoring/**",
  "packages/shared/**",
  "packages/config/**",
  "data/**",
  "pnpm-lock.yaml",
]

[deploy]
# Smoke only — hello exits 0. Restart must be Never (or one-off); ON_FAILURE
# is wrong here because a successful exit would still loop if misconfigured as
# always-restart, and hello is not a long-running process.
startCommand = "node dist/cli.js hello"
restartPolicyType = "NEVER"
