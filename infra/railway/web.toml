# Railway "web" service settings (Root Directory = monorepo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/config/**",
  "packages/shared/**",
  "packages/geoprivacy/**",
  "pnpm-lock.yaml",
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
