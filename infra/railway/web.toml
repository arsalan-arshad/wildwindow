# Railway "web" service settings (Root Directory = monorepo root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/config/**",
  "packages/shared/**",
  "packages/geoprivacy/**",
  "pnpm-lock.yaml",
]

[deploy]
# Must match RAILWAY_HEALTHCHECK.web in infra/lib/railway-cd.ts (T9.4).
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
